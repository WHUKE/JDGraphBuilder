[project]
name = "jdgraphbuilder"
version = "0.1.0"
description = "核心系统 — 数据清洗、图建模、入库"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.2.25",
    "neo4j>=6.1.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 顶层导入名就是 `src`（与 `python -m src.cli.build` 一致）
packages = ["src"]
